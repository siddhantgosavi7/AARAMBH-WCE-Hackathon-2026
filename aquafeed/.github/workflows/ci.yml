name: AquaFeed CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r aquafeed/backend/requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check aquafeed/backend

      - name: Run Pytest with Coverage
        run: |
          pytest aquafeed/backend/tests -v --cov=aquafeed/backend/app/core --cov-report=term-missing --cov-fail-under=85

  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: aquafeed/frontend/package.json

      - name: Install dependencies
        working-directory: aquafeed/frontend
        run: npm ci

      - name: Build frontend
        working-directory: aquafeed/frontend
        run: npm run build
