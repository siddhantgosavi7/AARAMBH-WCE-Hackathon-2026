[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = [".", ".."]
filterwarnings = ["ignore::DeprecationWarning"]

[project]
name = "crop-analytics-backend"
version = "0.1.0"
description = "Backend for crop analytics"
dependencies = [
    "fastapi>=0.110.0,<0.120.0",
    "uvicorn[standard]>=0.29.0,<0.35.0",
    "sqlalchemy>=2.0.28,<2.1.0",
    "pydantic>=2.6.4,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "apscheduler>=3.10.4,<4.0.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "PyJWT>=2.8.0,<3.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt==3.2.2"
]
